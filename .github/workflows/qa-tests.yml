name: IAM QA Automation Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QA framework
        uses: actions/checkout@v4

      - name: Checkout IdentityFlow application
        uses: actions/checkout@v4
        with:
          repository: sachintechpro/identityflow
          path: identityflow-source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r iam-qa-automation/requirements.txt

      - name: Run QA automation
        working-directory: iam-qa-automation
        env:
          IAM_APP_PATH: ${{ github.workspace }}/identityflow-source/identityflow
        run: |
          mkdir -p reports
          python -m pytest -v \
            --html=reports/report.html \
            --self-contained-html \
            --junitxml=reports/results.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iam-qa-test-results
          path: iam-qa-automation/reports/
          if-no-files-found: warn

  publish-results:
    name: Publish public test dashboard
    needs: automation
    if: ${{ always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: qa-pages-publication
      cancel-in-progress: false
    steps:
      - name: Checkout dashboard generator
        uses: actions/checkout@v4

      - name: Download automation results
        uses: actions/download-artifact@v4
        with:
          name: iam-qa-test-results
          path: iam-qa-automation/reports/

      - name: Generate public dashboard
        run: |
          python3 tools/build_dashboard.py \
            --junit iam-qa-automation/reports/results.xml \
            --out site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
